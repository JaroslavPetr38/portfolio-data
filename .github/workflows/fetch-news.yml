name: Fetch external news sources (Patria + SEC EDGAR)

on:
  schedule:
    # 5:30 UTC = 6:30 CET (zima) / 7:30 CEST (léto)
    # V obou případech bezpečně PŘED 8:00 místního času, kdy běží Routine.
    # GitHub Actions cron je vždy v UTC a nereflektuje letní/zimní čas
    # automaticky - proto je zvolen čas s rezervou pro obě sezóny
    # (1.5h rezerva v zimě, 30 min v létě).
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}       # umožní i ruční spuštění z GitHub UI

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch script
        run: |
          python3 scripts/fetch_news_sources.py \
            --tickers-file news/portfolio_tickers.json \
            --output-file news/external_feeds.json \
            --discovery-file news/sec_item_types_discovered.json

      - name: Commit and push result
        run: |
          git config user.name "news-fetch-bot"
          git config user.email "actions@github.com"
          git add news/external_feeds.json news/sec_item_types_discovered.json
          git diff --staged --quiet || git commit -m "news: external feeds refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push